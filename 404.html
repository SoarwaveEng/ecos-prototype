<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Not found</title>
<style>
:root{--brand:#0B6E9E;--ink:#1D2630;--ink-muted:#4B5B66;--line:#E2E8F0;--page:#F6F6F8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--page);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif}
main{max-width:380px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{margin:0 0 6px;font-size:22px}
p{margin:0;color:var(--ink-muted)}
</style>
</head>
<body>
<main>
<h1>Page not found</h1>
<p>There is nothing at this address. Check the link you were given.</p>
</main>
</body>
</html>
